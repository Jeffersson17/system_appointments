[tool.isort]
line_length = 120
multi_line_output = 3
include_trailing_comma = true
force_grid_wrap = 0
use_parentheses = true
ensure_newline_before_comments = true
sections = ["FUTURE", "STDLIB", "THIRDPARTY", "FIRSTPARTY", "LOCALFOLDER"]

known_first_party = ["enterprise", "user", "services", "system_appointments", "clients"]
known_third_party = ["django", "requests", "rest_framework", "urllib"]

skip = ["migrations"]

[tool.pylint.messages_control]

disable = [
    "missing-docstring",
    "invalid-name",
    "too-few-public-methods",
    "E1101",
    "R0901",
    "E0401",
    "W0613",
    "C0411",
    "W0246",
    "W0212",
    "W1514",
    "W0718",
    "R0801",
]
max-line-length = 120

[tool.pylint.format]
max-line-length = 120

[tool.pylint.design]
max-attributes = 10
max-locals = 15

[tool.pylint.files]
ignore-paths = ["manage.py"]
ignore = ["migrations"]